<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องคอมเสมือนจริง VR</title>
<style>
:root{--panel:rgba(255,255,255,.92);--fg:#1a1f2b;--mut:#5b6475;--ac:#0a84d6;--bd:#cfd6e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:rgba(20,24,34,.92);--fg:#e8ecf4;--mut:#9aa5ba;--ac:#4cc3ff;--bd:#33405a}}
:root[data-theme="dark"]{--panel:rgba(20,24,34,.92);--fg:#e8ecf4;--mut:#9aa5ba;--ac:#4cc3ff;--bd:#33405a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#1b2030;font-family:"Noto Sans Thai",Tahoma,sans-serif;color:var(--fg);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
.p{position:absolute;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:10px}
#top{top:calc(10px + env(safe-area-inset-top,0px));left:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#pal{top:calc(70px + env(safe-area-inset-top,0px));left:10px;display:flex;flex-direction:column;gap:6px;max-width:150px}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#info{top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:260px;max-width:calc(100% - 180px);display:none}
#info h3{margin:0 0 4px;font-size:17px}#info p{margin:4px 0;font-size:13px;color:var(--mut)}#info ul{margin:6px 0;padding-left:18px;font-size:13px}
#hint{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:13px;color:var(--mut);max-width:92%;text-align:center}
.row{display:flex;gap:6px;margin-top:6px}
</style></head><body>
<canvas id="c"></canvas>
<div class="p" id="top"><b>🖥 ห้องคอม VR</b>
<button id="mb" class="on">🛠 สร้างห้อง</button><button id="mw">🚶 เดินชม</button><button id="clr">🗑 ล้างห้อง</button></div>
<div class="p" id="pal"></div>
<div class="p" id="info"><h3 id="in"></h3><p id="id"></p><ul id="is"></ul>
<div class="row" id="ib"><button id="rot">↻ หมุน (R)</button><button id="del">ลบ (Del)</button></div></div>
<div class="p" id="hint"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const INFO={
desk:{n:"โต๊ะคอม + PC",d:"ชุดคอมพิวเตอร์สำหรับทำงานหนึ่งที่นั่ง ประกอบด้วยจอ คีย์บอร์ด เมาส์ และเคสคอม",s:["จอ LED 24 นิ้ว Full HD","CPU 8 คอร์ / RAM 16 GB","SSD 512 GB"],h:1.65},
chair:{n:"เก้าอี้สำนักงาน",d:"เก้าอี้ปรับระดับได้ มีล้อเลื่อน ช่วยลดอาการปวดหลังเวลานั่งทำงานนาน",s:["ปรับความสูงได้","พนักพิงรองรับหลัง","ฐานล้อเลื่อน 5 แฉก"],h:1.3},
rack:{n:"เซิร์ฟเวอร์แร็ค",d:"ตู้เก็บเซิร์ฟเวอร์และอุปกรณ์เครือข่าย ไฟสีเขียวแสดงว่าอุปกรณ์ทำงานปกติ",s:["ตู้มาตรฐาน 19 นิ้ว","ช่องติดตั้ง 8 ยูนิต","ระบายอากาศด้วยพัดลม"],h:2.3},
router:{n:"Router + Switch",d:"อุปกรณ์กระจายสัญญาณอินเทอร์เน็ต Router เชื่อมออกเน็ต ส่วน Switch แจกจ่ายสาย LAN ให้เครื่องต่าง ๆ",s:["Wi-Fi 6 สองเสาอากาศ","พอร์ต Gigabit Ethernet","เชื่อมต่อได้หลายเครื่อง"],h:1.4},
printer:{n:"เครื่องพิมพ์",d:"เครื่องพิมพ์เอกสารที่ใช้ร่วมกันผ่านเครือข่าย พิมพ์ถ่ายเอกสารและสแกนได้",s:["พิมพ์ขาวดำ/สี","ถาดกระดาษ A4","เชื่อมต่อ LAN / Wi-Fi"],h:1.4},
ups:{n:"UPS สำรองไฟ",d:"เครื่องสำรองไฟ ช่วยให้คอมและเซิร์ฟเวอร์ทำงานต่อได้ชั่วคราวเมื่อไฟดับ และป้องกันไฟกระชาก",s:["1000 VA","สำรองไฟประมาณ 10–15 นาที","ป้องกันไฟกระชาก"],h:.95}};
const $=id=>document.getElementById(id);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:.1},o));
const bx=(g,w,h,d,x,y,z,m)=>{const s=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);s.position.set(x,y,z);s.castShadow=s.receiveShadow=true;g.add(s);return s};
const led=c=>M(c,{emissive:c,emissiveIntensity:1});
const B={
desk(g){const w=M(0x8a6a4a),k=M(0x222831);bx(g,1.4,.05,.7,0,.75,0,w);
[[-.65,-.3],[.65,-.3],[-.65,.3],[.65,.3]].forEach(p=>bx(g,.05,.75,.05,p[0],.37,p[1],w));
bx(g,.6,.36,.03,0,1.2,-.2,k);bx(g,.56,.32,.01,0,1.2,-.18,M(0x1e90ff,{emissive:0x1e6bd0,emissiveIntensity:.8}));
bx(g,.05,.2,.05,0,.9,-.2,k);bx(g,.2,.01,.14,0,.78,-.2,k);bx(g,.44,.02,.14,0,.79,.12,k);bx(g,.06,.025,.1,.35,.79,.12,k);
bx(g,.2,.45,.45,.95,.225,-.05,k);bx(g,.02,.02,.02,.95,.4,.18,led(0x00ff66))},
chair(g){const k=M(0x2d3748);bx(g,.45,.06,.45,0,.5,0,k);bx(g,.45,.5,.06,0,.8,.22,k);bx(g,.06,.45,.06,0,.25,0,M(0x888888));
bx(g,.5,.04,.06,0,.04,0,k);bx(g,.06,.04,.5,0,.04,0,k)},
rack(g){const d=M(0x1a1d26);bx(g,.6,1.9,.8,0,.95,0,d);for(let i=0;i<8;i++){bx(g,.5,.1,.02,0,.2+i*.2,.41,M(0x2a3040));bx(g,.03,.03,.02,.2,.2+i*.2,.42,led(i%3?0x00ff66:0xffaa00))}},
router(g){bx(g,.6,.7,.4,0,.35,0,M(0x6b7280));bx(g,.45,.06,.25,0,.73,0,M(0x222831));bx(g,.03,.03,.01,.15,.73,.13,led(0x00ff66));
bx(g,.28,.04,.2,0,.78,0,M(0xf3f4f6));bx(g,.015,.22,.015,-.1,.91,-.05,M(0xf3f4f6));bx(g,.015,.22,.015,.1,.91,-.05,M(0xf3f4f6))},
printer(g){bx(g,.6,.6,.45,0,.3,0,M(0x6b7280));bx(g,.5,.2,.38,0,.7,0,M(0xe5e7eb));bx(g,.38,.02,.2,0,.82,-.1,M(0xffffff));bx(g,.38,.02,.16,0,.62,.28,M(0xffffff));bx(g,.03,.03,.01,.2,.72,.2,led(0x00ff66))},
ups(g){bx(g,.25,.35,.45,0,.175,0,M(0x1f2937));bx(g,.03,.03,.01,.08,.28,.23,led(0x00ff66))}};
function sign(t,h){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');
x.fillStyle='rgba(15,23,42,.92)';x.fillRect(4,4,504,120);x.strokeStyle='#4cc3ff';x.lineWidth=6;x.strokeRect(4,4,504,120);
x.fillStyle='#fff';x.font='bold 46px "Noto Sans Thai",Tahoma,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t,256,66,480);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(1.1,.275,1);s.position.y=h;s.raycast=()=>{};return s}
function build(type,withSign=true){const g=new THREE.Group();B[type](g);g.userData.type=type;if(withSign)g.add(sign(INFO[type].n,INFO[type].h));return g}

const cv=$('c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const S=new THREE.Scene();S.background=new THREE.Color(0x1b2030);
const cam=new THREE.PerspectiveCamera(60,1,.1,100);cam.rotation.order='YXZ';
S.add(new THREE.HemisphereLight(0xffffff,0x445066,.7));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(4,9,5);dl.castShadow=true;dl.shadow.camera.left=-9;dl.shadow.camera.right=9;dl.shadow.camera.top=9;dl.shadow.camera.bottom=-9;S.add(dl);
const RW=12,RD=10;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),M(0x6b7585,{roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;S.add(floor);
const grid=new THREE.GridHelper(12,24,0x99a3b8,0x7d879b);grid.scale.z=RD/RW;grid.position.y=.01;S.add(grid);
const walls=[[0,-RD/2,RW,.2,0,-1],[0,RD/2,RW,.2,0,1],[-RW/2,0,.2,RD,-1,0],[RW/2,0,.2,RD,1,0]].map(a=>{
const m=new THREE.Mesh(new THREE.BoxGeometry(a[2],2.8,a[3]),M(0xd8dde8,{roughness:.95}));m.position.set(a[0],1.4,a[1]);m.receiveShadow=true;m.userData.n=[a[4],a[5]];S.add(m);return m});

const items=[];let mode='build',sel=null,ghost=null,gType=null,gRot=0;
const ring=new THREE.Mesh(new THREE.RingGeometry(.7,.8,32),new THREE.MeshBasicMaterial({color:0x4cc3ff,side:2}));ring.rotation.x=-Math.PI/2;ring.position.y=.03;ring.visible=false;S.add(ring);
const clampP=(v,a)=>Math.max(-a,Math.min(a,v));
function addItem(t,x,z,r){const g=build(t);g.position.set(clampP(x,RW/2-.5),0,clampP(z,RD/2-.5));g.rotation.y=r;S.add(g);items.push(g);return g}
function select(g){sel=g;if(!g){$('info').style.display='none';ring.visible=false;return}
const i=INFO[g.userData.type];$('in').textContent=i.n;$('id').textContent=i.d;$('is').innerHTML='';i.s.forEach(t=>{const l=document.createElement('li');l.textContent=t;$('is').appendChild(l)});
$('ib').style.display=mode==='build'?'flex':'none';$('info').style.display='block';ring.visible=true;ring.position.x=g.position.x;ring.position.z=g.position.z}
function delSel(){if(!sel)return;S.remove(sel);items.splice(items.indexOf(sel),1);select(null)}
function rotSel(){if(ghost){gRot+=Math.PI/2;ghost.rotation.y=gRot}else if(sel)sel.rotation.y+=Math.PI/2}
function setGhost(t){if(ghost){S.remove(ghost);ghost=null}gType=t;
document.querySelectorAll('#pal button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
if(t){ghost=build(t,false);ghost.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=.5}});ghost.rotation.y=gRot;ghost.visible=false;S.add(ghost);select(null)}updHint()}
Object.keys(INFO).forEach(t=>{const b=document.createElement('button');b.dataset.t=t;b.textContent=INFO[t].n;b.onclick=()=>setGhost(gType===t?null:t);$('pal').appendChild(b)});

// preset layout
[-3,-1,1,3].forEach(x=>{addItem('desk',x,-4,0);addItem('chair',x,-3.2,0)});
[-2,0,2].forEach(x=>{addItem('desk',x,-1.5,0);addItem('chair',x,-.7,0)});
addItem('rack',5.2,-4.2,0);addItem('rack',5.2,-3.2,0);addItem('router',-5.2,-4.2,0);addItem('ups',4,-4.4,0);addItem('printer',5,3.5,Math.PI);

// camera
let th=.5,ph=.95,rad=14,yaw=0,pitch=0,walkTo=null;const keys={};
function camBuild(){cam.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph),rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,0,0)}
function camWalk(){cam.rotation.set(pitch,yaw,0)}
function updHint(){$('hint').textContent=mode==='build'?(gType?'คลิกพื้นเพื่อวางอุปกรณ์ · R หมุน · Esc ยกเลิก · ลากเมาส์หมุนมุมมอง · ล้อเมาส์ซูม':'เลือกอุปกรณ์ทางซ้ายเพื่อวาง · คลิกอุปกรณ์เพื่อดูข้อมูล · ลากเมาส์หมุนมุมมอง'):'ลากเมาส์เพื่อมองรอบ · คลิกพื้นเพื่อเดินไป · W/S หรือล้อเมาส์เดินหน้า-ถอย · คลิกอุปกรณ์เพื่อดูข้อมูล'}
function setMode(m){mode=m;$('mb').classList.toggle('on',m==='build');$('mw').classList.toggle('on',m==='walk');
$('pal').style.display=m==='build'?'flex':'none';$('clr').style.display=m==='build'?'':'none';setGhost(null);select(null);
if(m==='walk'){cam.position.set(0,1.6,4);yaw=0;pitch=0;walkTo=null;grid.visible=false;camWalk()}else{grid.visible=true;camBuild()}updHint()}
$('mb').onclick=()=>setMode('build');$('mw').onclick=()=>setMode('walk');
$('clr').onclick=()=>{items.splice(0).forEach(g=>S.remove(g));select(null)};
$('rot').onclick=rotSel;$('del').onclick=delSel;

// pointer
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let down=null;
function setRay(e){const r=cv.getBoundingClientRect();mp.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mp,cam)}
const floorPt=()=>{const h=ray.intersectObject(floor)[0];return h?h.point:null};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,moved:false};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{setRay(e);
if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(!down.moved&&Math.hypot(dx,dy)>5)down.moved=true;
if(down.moved){const mx=e.movementX||0,my=e.movementY||0;
if(mode==='build'){th-=mx*.006;ph=Math.max(.2,Math.min(1.45,ph-my*.006));camBuild()}else{yaw-=mx*.004;pitch=Math.max(-1.2,Math.min(1.2,pitch-my*.004));camWalk()}}}
if(ghost&&mode==='build'){const p=floorPt();if(p){ghost.visible=true;ghost.position.set(clampP(Math.round(p.x*2)/2,RW/2-.5),0,clampP(Math.round(p.z*2)/2,RD/2-.5))}else ghost.visible=false}});
cv.addEventListener('pointerup',e=>{const was=down;down=null;if(!was||was.moved)return;setRay(e);
if(mode==='build'&&gType){const p=floorPt();if(p)addItem(gType,Math.round(p.x*2)/2,Math.round(p.z*2)/2,gRot);return}
const h=ray.intersectObjects(items,true)[0];
if(h){let o=h.object;while(o&&!o.userData.type)o=o.parent;if(o)return select(o)}
select(null);if(mode==='walk'){const p=floorPt();if(p)walkTo={x:clampP(p.x,5.7),z:clampP(p.z,4.7)}}});
cv.addEventListener('wheel',e=>{e.preventDefault();if(mode==='build'){rad=Math.max(5,Math.min(22,rad+e.deltaY*.01));camBuild()}else{walk(-e.deltaY*.004)}},{passive:false});
function walk(d){cam.position.x=clampP(cam.position.x-Math.sin(yaw)*d,5.7);cam.position.z=clampP(cam.position.z-Math.cos(yaw)*d,4.7)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='r')rotSel();if(k==='delete')delSel();if(k==='escape'){setGhost(null);select(null)}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
(function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.1);
if(mode==='walk'){const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
if(f){walkTo=null;walk(f*3*dt)}else if(walkTo){const dx=walkTo.x-cam.position.x,dz=walkTo.z-cam.position.z,d=Math.hypot(dx,dz);
if(d<.1)walkTo=null;else{const s=Math.min(d,3*dt)/d;cam.position.x+=dx*s;cam.position.z+=dz*s}}}
walls.forEach(w=>{w.visible=mode==='walk'||(cam.position.x*w.userData.n[0]+cam.position.z*w.userData.n[1])<0});
ring.visible=!!sel;if(sel){ring.position.x=sel.position.x;ring.position.z=sel.position.z}
R.render(S,cam)})();
setMode('build');
</script></body></html>
